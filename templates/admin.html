<!doctype html><html><head><meta charset="utf-8"/><title>Admin</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main class="container"><h1>Offer moderation dashboard</h1><p>Review offers and mark as school-confirmed.</p><table><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Deadline</th><th>Action</th></tr></thead><tbody>{% for offer in offers %}<tr><td>{{ offer.title }}</td><td>{{ offer.offer_type }}</td><td>{{ offer.verification_status }}</td><td>{{ offer.deadline }}</td><td><form method="post" action="/admin/offers/{{ offer.id }}/verify"><button class="button" type="submit">Verify</button></form></td></tr>{% endfor %}</tbody></table></main></body></html>
